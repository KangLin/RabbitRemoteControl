[Core]
DumpFile=true
DumpToLogFile=true

################################### Log ###################################
[Log]
;; Log file path.
;Path=log
;; Log file name (Name_ProcessId_DateFormat_No.log).
;; the ProcessId and No is generated by the programe.
;Name=  ; Default is application name
DateFormat="yyyy-MM-dd"
;; Log file length
;Length=100M
;; Log file count
;Count=10
;; Write log file interval
;Interval=1

;; Message format pattern. See: https://doc.qt.io/qt-6/qtlogging.html#qSetMessagePattern
;Pattern="[%{time hh:mm:ss.zzz} %{pid}|%{threadid} %{if-debug}D%{endif}%{if-info}I%{endif}%{if-warning}W%{endif}%{if-critical}E%{endif}%{if-fatal}F%{endif}] %{category} - %{message} [%{file}:%{line}, %{function}]"
Pattern="[%{time hh:mm:ss.zzz} %{pid}|%{threadid} %{if-debug}D%{endif}%{if-info}I%{endif}%{if-warning}W%{endif}%{if-critical}E%{endif}%{if-fatal}F%{endif}] %{category} - %{message}"

;; Enable print stack trace
;PrintStackTrace=true
;; PrintStackTraceLevel is a combination of the following values. Separated by ‘,’:
;;   0: debug
;;   1: warning
;;   2: error
;;   3: fatal
;;   4: information
;; eg: warning, error
;;PrintStackTraceLevel=1,2
PrintStackTraceLevel=2

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; Log rules
;; Please see QLoggingCategory documents: https://doc.qt.io/qt-6/qloggingcategory.html#logging-rules
;; Format:
;;    <category>[.<type>] = true|false
[Rules]
;*=false
*.debug=false
;*.warning=false

;RabbitCommon*=false
;RabbitCommon.Updater=true

Client.Backend.Desktop.Mouse=false
Client.FrmViewer.Key=false
Client.FrmViewer.Mouse=false
Client.FrmViewer.InputMethod=false

Backend.Desktop.Key=false
Backend.Desktop.Mouse=false
Backend.Desktop.InputMethod=false

VNC.Backend.Key=false
VNC.Backend.InputMethod=false
VNC.Backend.Mouse=false

LibVNCServer.Backend.Key=false
LibVNCServer.Backend.InputMethod=false
LibVNCServer.Backend.Mouse=false

;FreeRDP*=true
;FreeRDP.Log=false
;FreeRDP.Log.debug=true
FreeRDP.Log.Trace=false
FreeRDP.Log.Fatal=false
FreeRDP.Backend.Key=false
FreeRDP.Backend.InputMethod=false
FreeRDP.Backend.Mouse=false

;WOL.*=true

;Player.*=true
;Screen.Capture.*=true

;*.multimedia.*=true
;*.ffmpeg.*=true
;qt.webenginecontext.debug=true
