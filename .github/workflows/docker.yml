# Author: Kang Lin <kl222@126.com>

name: docker

on:
  workflow_call:
    outputs:
      name:
        description: "The artifact name"
        value: ${{ jobs.build_docker.outputs.name }}

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

jobs:
  build_docker:
    strategy:
      matrix:
        variant:
          # - PACKAGE: deb
          #   image: ubuntu
          #   lable: "25.04"
          #   os: ubuntu-24.04
          # - PACKAGE: deb
          #   image: ubuntu
          #   lable: "25.04"
          #   os: ubuntu-24.04-arm
          - PACKAGE: deb
            image: ubuntu
            lable: "26.04"
            os: ubuntu-24.04
          - PACKAGE: deb
            image: ubuntu
            lable: "26.04"
            os: ubuntu-24.04-arm

          - PACKAGE: deb
            image: debian
            lable: "12"
            os: ubuntu-24.04
          - PACKAGE: deb
            image: debian
            lable: "12"
            os: ubuntu-24.04-arm
          - PACKAGE: deb
            image: debian
            lable: "13"
            os: ubuntu-24.04
          - PACKAGE: deb
            image: debian
            lable: "13"
            os: ubuntu-24.04-arm

          # - PACKAGE: deb
          #   image: linuxdeepin/beige
          #   lable: "latest"
          #   os: ubuntu-24.04
          # - PACKAGE: deb
          #   image: linuxdeepin/beige
          #   platform: linux/arm64
          #   lable: "latest"
          #   os: ubuntu-24.04-arm

          # - PACKAGE: appimage
          #   image: ubuntu
          #   lable: "26.04"
          #   os: ubuntu-24.04
          # - PACKAGE: appimage
          #   image: ubuntu
          #   lable: "26.04"
          #   os: ubuntu-24.04-arm
          - PACKAGE: appimage
            image: debian
            lable: "13"
            os: ubuntu-24.04
          - PACKAGE: appimage
            image: debian
            lable: "13"
            os: ubuntu-24.04-arm

          - PACKAGE: rpm
            image: fedora
            lable: "43"
            os: ubuntu-24.04
          - PACKAGE: rpm
            image: fedora
            lable: "43"
            os: ubuntu-24.04-arm
          - PACKAGE: rpm
            image: fedora
            lable: "42"
            os: ubuntu-24.04
          - PACKAGE: rpm
            image: fedora
            lable: "42"
            os: ubuntu-24.04-arm
          - PACKAGE: rpm
            image: fedora
            lable: "41"
            os: ubuntu-24.04
          - PACKAGE: rpm
            image: fedora
            lable: "41"
            os: ubuntu-24.04-arm

    # See: [About GitHub-hosted runners](https://docs.github.com/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners)
    # See: [Choosing the runner for a job](https://docs.github.com/actions/writing-workflows/choosing-where-your-workflow-runs/choosing-the-runner-for-a-job)
    # See: https://github.com/actions/runner-images/
    runs-on: ${{matrix.variant.os}}

    env:
      RabbitRemoteControl_VERSION: 0.1.0-dev
      artifact_name: build_docker
      BUILD_DIR:     ${{github.workspace}}/build
      SOURCE_DIR:    ${{github.workspace}}/.cache/source
      TOOLS_DIR:     ${{github.workspace}}/.cache/tools_${{matrix.variant.os}}
      INSTALL_DIR:   ${{github.workspace}}/.cache/install_docker_${{matrix.variant.PACKAGE}}_${{matrix.variant.image}}_${{matrix.variant.lable}}_${{matrix.variant.os}}
      BUILD_VERBOSE: ${{matrix.variant.BUILD_VERBOSE}}

    # Map the job outputs to step outputs
    outputs:
      name: ${{ env.artifact_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - name: Make directories
        run: |
          cmake -E make_directory ${{env.BUILD_DIR}}
          cmake -E make_directory ${{env.SOURCE_DIR}}
          cmake -E make_directory ${{env.TOOLS_DIR}}
          cmake -E make_directory ${{env.INSTALL_DIR}}

      - name: Cache installed
        uses: actions/cache@v5
        id: cache-installed
        with:
          path: |
            ${{env.INSTALL_DIR}}
            ${{env.TOOLS_DIR}}/linuxdeploy-*
            ${{env.TOOLS_DIR}}/qt_*
          key: install_docker_${{matrix.variant.PACKAGE}}_${{matrix.variant.image}}${{matrix.variant.lable}}_${{matrix.variant.os}}

      - name: git clone RabbitCommon
        working-directory: ${{env.SOURCE_DIR}}
        run: |
            git clone https://github.com/KangLin/RabbitCommon.git

      - name: run docker
        env:
          RabbitCommon_ROOT: ${{env.SOURCE_DIR}}/RabbitCommon
        run: |
          if [ -n "${{matrix.variant.lable}}" ]; then
            docker_image="${{matrix.variant.image}}:${{matrix.variant.lable}}"
          else
            docker_image="${{matrix.variant.image}}"
          fi
          ./Script/build_linux.sh --install=${{env.INSTALL_DIR}} \
            --source=${{env.SOURCE_DIR}} \
            --tools=${{env.TOOLS_DIR}} \
            --docker-image="${docker_image}" \
            --docker-platform="${{matrix.variant.platform}}" --${{matrix.variant.PACKAGE}}

      - name: Rename deb file
        if: ${{ matrix.variant.PACKAGE == 'deb' }}
        #continue-on-error: true
        working-directory: ${{env.BUILD_DIR}}/build_linux
        run: |
          if [ -n "${{matrix.variant.lable}}" ]; then
            docker_image="${{matrix.variant.image}}${{matrix.variant.lable}}"
          else
            docker_image="${{matrix.variant.image}}"
          fi
          mv rabbitremotecontrol_*.deb rabbitremotecontrol_${{env.RabbitRemoteControl_VERSION}}_${docker_image}_`uname -m`.deb

      - name: Zip AppIagme file
        if: ${{ matrix.variant.PACKAGE == 'appimage' && matrix.variant.image == 'ubuntu'}}
        working-directory: ${{env.BUILD_DIR}}/build_linux
        #continue-on-error: true
        run: |
          ARCH=`uname -m`
          pushd ${{env.BUILD_DIR}}/build_linux/install
          sudo mv -f RabbitRemoteControl_${ARCH}.AppImage RabbitRemoteControl_${{env.RabbitRemoteControl_VERSION}}_Linux_${ARCH}.AppImage
          popd
          pushd ${{env.BUILD_DIR}}/build_linux
          mv install RabbitRemoteControl_${{env.RabbitRemoteControl_VERSION}}_Linux_${ARCH}_Setup
          zip RabbitRemoteControl_${{env.RabbitRemoteControl_VERSION}}_Linux_${ARCH}_Setup.zip RabbitRemoteControl_${{env.RabbitRemoteControl_VERSION}}_Linux_${ARCH}_Setup/*
          popd

      - name: update configure file
        working-directory: ${{env.BUILD_DIR}}/build_linux
        run: |
          ARCH=`uname -m`
          OS="${{matrix.variant.image}}"
          OS_VERSIOIN="${{matrix.variant.lable}}"
          PACKAGE_NAME="rabbitremotecontrol"
          if [ -n "${{matrix.variant.lable}}" ]; then
            docker_image="${{matrix.variant.image}}${{matrix.variant.lable}}"
          else
            docker_image="${{matrix.variant.image}}"
          fi
          cd ${{env.BUILD_DIR}}/build_linux
          case ${{matrix.variant.PACKAGE}} in
            "deb")
              FILE_NAME=rabbitremotecontrol_${{env.RabbitRemoteControl_VERSION}}_${docker_image}_`uname -m`.deb
              ;;
            "rpm")
              RPM_VERSION=${RabbitRemoteControl_VERSION//-/\_}
              FILE_NAME=rabbitremotecontrol-${RPM_VERSION}-1.fc${{matrix.variant.lable}}.${ARCH}.rpm
              ;;
            "appimage")
              FILE_NAME=RabbitRemoteControl_${{env.RabbitRemoteControl_VERSION}}_Linux_${ARCH}_Setup.zip
              OS="AppImage"
              OS_VERSIOIN=""
              PACKAGE_NAME="io.github.KangLin.RabbitRemoteControl"
              ;;
          esac
          sudo chmod a+xr ${FILE_NAME}
          echo "Generate update configure file ......"
          ${{env.SOURCE_DIR}}/RabbitCommon/Script/GenerateJsonFile.sh -v \
            -f update_${{matrix.variant.PACKAGE}}_${{matrix.variant.image}}_${{matrix.variant.lable}}_${ARCH}.json \
            -n "${PACKAGE_NAME}" \
            -p "${FILE_NAME}" \
            -s ${OS} \
            --system-version=${OS_VERSIOIN} \
            -a ${ARCH} \
            -u "https://github.com/KangLin/RabbitRemoteControl/releases/download/v${{env.RabbitRemoteControl_VERSION}}/${FILE_NAME},https://master.dl.sourceforge.net/project/rabbitremotecontrol/v${{env.RabbitRemoteControl_VERSION}}/${FILE_NAME}?viasf=1"

      - name: Update artifact
        #if: ${{matrix.variant.PACKAGE != 'deb'}}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.artifact_name }}_${{matrix.variant.PACKAGE}}_${{matrix.variant.image}}_${{matrix.variant.lable}}_${{matrix.variant.os}}
          path: |
            ${{env.BUILD_DIR}}/build_linux/rabbitremotecontrol*.rpm
            ${{env.BUILD_DIR}}/build_linux/rabbitremotecontrol_*.deb
            ${{env.BUILD_DIR}}/build_linux/RabbitRemoteControl_*_Setup.zip
            ${{env.BUILD_DIR}}/build_linux/update_*.json
